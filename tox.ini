[tox]
envlist = py{310,311,312,313}-dj52
          py{312,313}-dj{60,61}

[testenv]
commands = {posargs:python tests/manage.py test testapp django_fsm.tests --noinput}
deps =
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    dj61: Django==6.1b1
    django-guardian>=2.4
    graphviz>=0.20
setenv =
    PYTHONPATH={toxinidir}:{toxinidir}/tests
    PYTHONDONTWRITEBYTECODE=1

[testenv:typing]
basepython = python3.12
deps =
    Django==6.1b1
    django-guardian>=2.4
    graphviz>=0.20
    mypy>=1.11
    pyright>=1.1.390
    django-stubs>=5.2
commands =
    python -m mypy
    pyright
    python -m mypy --config-file tests/typing/mypy-plugin.ini tests/typing/usage.py
